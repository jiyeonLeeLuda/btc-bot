[project]
name = "btc-bot"
version = "0.1.0"
description = "Learning-oriented BTC paper trading bot (Binance)"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.0",
    "pandas>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
btc-bot = "btc_bot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_bot"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
